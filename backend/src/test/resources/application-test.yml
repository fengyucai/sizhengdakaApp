spring:
  datasource:
    url: jdbc:h2:mem:ai_sizheng_test;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: 127.0.0.1
      port: 6379

app:
  face:
    provider: TENCENT
  jwt:
    secret: test-secret-key-for-ai-sizheng-256bit
    access-token-expire: 7200
    refresh-token-expire: 604800
  alert:
    enabled: false
  baidu-ai:
    app-id:
    api-key:
    secret-key:
    map-ak:
    face-group: test
  tencent-cloud:
    secret-id:
    secret-key:
    app-id:
    region: ap-guangzhou
    face-group: test

minio:
  endpoint: http://localhost:9000
  access-key: test
  secret-key: test
  bucket: test

logging:
  level:
    com.nhu.aisizheng: WARN
