# =============================================
# AI思政 - 开发环境配置
# =============================================
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ai_sizheng;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:aisizheng}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate  # 使用SQL脚本管理表结构，JPA仅验证
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
  data:
    redis:
      host: localhost
      port: 6379
      # password:  # 开发环境无需密码

# JWT配置
app:
  face:
    provider: ${FACE_PROVIDER:BAIDU}
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-256bit-min}
    access-token-expire: 7200    # 2小时 (秒)
    refresh-token-expire: 604800 # 7天 (秒)
  # 百度AI配置
  baidu-ai:
    app-id: ${BAIDU_AI_APP_ID:}
    api-key: ${BAIDU_AI_API_KEY:}
    secret-key: ${BAIDU_AI_SECRET_KEY:}
    map-ak: ${BAIDU_MAP_AK:}
    face-group: dorm_checkin
  tencent-cloud:
    secret-id: ${TENCENT_CLOUD_SECRET_ID:}
    secret-key: ${TENCENT_CLOUD_SECRET_KEY:}
    app-id: ${TENCENT_CLOUD_APP_ID:}
    region: ${TENCENT_CLOUD_REGION:ap-guangzhou}
    face-group: ${TENCENT_FACE_GROUP:dorm_checkin}
  alert:
    enabled: true
    dorm-remind-time: "21:30"
    dorm-deadline: "23:00"
    intern-deadline: "18:00"
  push:
    provider: ${PUSH_PROVIDER:NONE}
    jpush:
      app-key: ${JPUSH_APP_KEY:}
      master-secret: ${JPUSH_MASTER_SECRET:}
      production: ${JPUSH_PRODUCTION:false}

# MinIO对象存储
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:ai-sizheng}

# 日志
logging:
  level:
    com.nhu.aisizheng: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
