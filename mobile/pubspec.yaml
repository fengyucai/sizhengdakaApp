name: ai_sizheng
description: AI思政打卡APP - 南华大学计算机学院学生端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP
  dio: ^5.4.0
  # State management
  provider: ^6.1.2
  # Router
  go_router: ^14.0.0
  # GPS
  geolocator: ^12.0.0
  # Camera
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  # QR code
  mobile_scanner: ^5.2.3
  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  # Toast
  fluttertoast: ^8.2.4
  # Date
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  google_mlkit_face_detection: ^0.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
